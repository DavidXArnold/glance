name: krew-release-bot

# Trigger on tag push: krew-release-bot derives the release version from
# GITHUB_REF and requires it to be a tag ref. To re-run for an existing
# release, dispatch manually with the tag selected as the ref.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  krew-release-bot:
    runs-on: ubuntu-latest
    steps:
      # Checkout main (not the tag) so we pick up the manifest that
      # GitLab CI updates with the correct version and checksums.
      - name: Checkout repository (main branch)
        uses: actions/checkout@v5
        with:
          ref: main

      # The tag is mirrored before GitLab CI finishes updating the
      # krew manifest on main. Poll until the manifest version matches
      # the tag, or time out after 45 minutes (the release pipeline,
      # including the manifest update, can take longer than 15 minutes).
      - name: Wait for manifest and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Waiting for plugins/krew/glance.yaml to contain $TAG and for the GitHub release $TAG to exist ..."
          for i in $(seq 1 90); do
            git fetch origin main --quiet
            git checkout origin/main -- plugins/krew/glance.yaml 2>/dev/null || true
            CURRENT=$(grep 'version:' plugins/krew/glance.yaml | head -1 | tr -d ' "' | cut -d: -f2)
            # krew-release-bot reads the release by tag, which GitLab CI
            # creates shortly after the manifest update lands on main.
            RELEASE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
            echo "  attempt $i: manifest version=$CURRENT, want=$TAG; release HTTP $RELEASE"
            if [ "$CURRENT" = "$TAG" ] && [ "$RELEASE" = "200" ]; then
              echo "Manifest and release are ready."
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: timed out waiting for manifest update and GitHub release"
          exit 1

      - name: Run krew-release-bot
        uses: rajatjindal/krew-release-bot@v0.0.46
        with:
          krew_template_file: plugins/krew/glance.yaml
