---
version: "2"

linters:
  default: none
  enable:
  - bodyclose
  # - depguard  # allow-list below is kept for reference; not enforced
  - dogsled
  - dupl
  - errcheck
  # - funlen  # data fetching functions are inherently long
  - gochecknoinits
  - goconst
  - gocritic
  - gocyclo
  - gosec
  - govet
  - ineffassign
  - lll
  - misspell
  - nakedret
  - staticcheck
  - unconvert
  - unparam
  - unused
  - whitespace
  # don't enable:
  # - gochecknoglobals
  # - gocognit
  # - godox
  # - makezero
  # - prealloc
  # - testpackage
  # - wrapcheck

  settings:
    govet:
      enable-all: true
      disable:
      - fieldalignment
    gocyclo:
      # The live TUI event and render loops are currently 20-28; splitting them
      # is tracked in #43. Lower this as they are broken up.
      min-complexity: 30
    dupl:
      threshold: 100
    goconst:
      # Two occurrences flags key names and column headers that read better inline.
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    lll:
      line-length: 140
    gocritic:
      enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
      disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
      # Kubernetes objects are large structs; the copies are negligible next to
      # the API calls that produce them, and indexing hurts readability.
      - rangeValCopy
      - hugeParam
      - unnamedResult
    funlen:
      lines: 100
      statements: 85
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
          - $gostd
          - gitlab.com/davidxarnold
          - github.com/aws
          - github.com/sirupsen
          - cloud.google.com
          - google.golang.org
          - k8s.io
          - github.com/spf13
          - github.com/mitchellh
          - github.com/gizak
          - github.com/jedib0t

  exclusions:
    rules:
    # Repeated literals in test fixtures are clearer inline than as constants.
    - path: _test\.go
      linters:
      - goconst
      - dupl
    # Test fixtures set fields for completeness even when a test does not read them.
    - path: _test\.go
      linters:
      - govet
      text: unusedwrite
